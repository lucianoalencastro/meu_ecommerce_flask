{% extends "layout.html" %}

{% block title %}
    Products
{% endblock %}

{% block main %}
<!-- Envolvi tudo nessa classe para aplicar as margens corretas -->
<div class="main-content">

    <!-- Nova div contêiner adicionada aqui para organizar os cards em grade -->
    <div class="products-grid">
        {% for product in products %}

            <div class="card">
                <a href="/product?id={{ product.id }}" class="product-img-link">
                    <img src="{{ url_for('static', filename='images/' ~ product.image) }}" alt="{{ product.name }}">
                </a>

                <h5>{{ product.name }}</h5>
                <p>{{ product.description }}</p>
                <strong>R$ {{ product.price }}</strong>

                <!-- Container para alinhar o botão "Ver produto" e o ícone de carrinho lado a lado -->
                <div style="display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem;">
                    <a href="/product?id={{ product.id }}" style="flex-grow: 1; text-align: center; margin-top: 0;">
                        Ver produto
                    </a>

                    <form action="/add_to_cart" method="post" style="margin: 0;">
                        <input type="hidden" name="product_id" value="{{ product.id }}">
                        <button type="submit" title="Adicionar ao Carrinho" style="background-color: #212529; color: #ffffff; border: none; border-radius: 6px; padding: 0.55rem 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-cart3" viewBox="0 0 16 16">
                                <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>

        {% endfor %}
    </div>

</div>
{% endblock %}
